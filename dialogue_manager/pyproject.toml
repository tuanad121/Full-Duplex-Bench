[project]
name = "vietnamese-dialogue-manager"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.2,<2",
  "numpy>=1.26,<3",
  "openai>=1.0",
  "tensorboard>=2.18,<3",
  "torch==2.5.1",
  "transformers>=4.51,<5",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
