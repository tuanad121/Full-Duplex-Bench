[project]
name = "vi-fdb-harness"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
asr = [
  "accelerate>=0.26",
  "chunkformer",
  "openai-whisper",
  "soundfile",
  "torch==2.5.1",
  "torchaudio==2.5.1",
  "transformers",
]
judge = ["openai>=1.0"]

[project.scripts]
vi-fdb = "harness:main"
vi-fdb-asr = "transcribe:main"
vi-fdb-judge = "judge:main"

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
